<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>پشتیبانی ایران ناسیونال</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy-deep:#050d1a; --navy:#0c1c33; --navy-2:#122a4a;
    --ice:#5fb3e8; --ice-soft:#8fd0f5; --silver:#c7d3de; --silver-dim:#7e8fa3;
    --white:#f4f8fb; --glass:rgba(255,255,255,0.045); --glass-brd:rgba(150,190,220,0.18);
    box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;}
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  html,body{height:100%;}
  body{margin:0;font-family:'Vazirmatn',sans-serif;
    background:radial-gradient(ellipse 900px 500px at 15% -10%, rgba(95,179,232,0.12), transparent 60%),
      radial-gradient(ellipse 700px 500px at 100% 110%, rgba(95,179,232,0.08), transparent 60%),
      linear-gradient(160deg, var(--navy-deep) 0%, #081525 45%, var(--navy) 100%);
    color:var(--white); overflow:hidden;}
  .app{width:100%;max-width:560px;height:100vh;height:100dvh;margin:0 auto;display:flex;flex-direction:column;position:relative;}
  .app.wide{max-width:980px;}
  header{display:flex;align-items:center;gap:14px;padding:calc(16px + env(safe-area-inset-top,0px)) 20px 16px;
    background:linear-gradient(180deg, rgba(12,28,51,0.9), rgba(12,28,51,0.55));backdrop-filter:blur(14px);
    border-bottom:1px solid var(--glass-brd);position:relative;z-index:3;flex-shrink:0;}
  header .logo-wrap{width:46px;height:46px;border-radius:50%;background:radial-gradient(circle at 35% 30%, #12335c, #061225 75%);
    border:1px solid rgba(143,208,245,0.35);display:flex;align-items:center;justify-content:center;
    box-shadow:0 0 18px rgba(95,179,232,0.25), inset 0 0 10px rgba(0,0,0,0.5);flex-shrink:0;overflow:hidden;}
  header .logo-wrap img{width:78%;height:78%;object-fit:contain;}
  header .brand{display:flex;flex-direction:column;gap:2px;min-width:0;}
  header .brand strong{font-weight:700;font-size:16px;color:var(--white);}
  header .brand span{font-size:12px;color:var(--silver-dim);}
  .status{margin-inline-start:auto;display:flex;align-items:center;gap:10px;flex-shrink:0;}
  .pill{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ice-soft);
    background:rgba(95,179,232,0.08);border:1px solid rgba(95,179,232,0.25);padding:5px 11px;border-radius:20px;}
  .pill .dot{width:6px;height:6px;border-radius:50%;background:#5fe8a0;box-shadow:0 0 6px #5fe8a0;}
  .modelink{font-size:11.5px;color:var(--silver-dim);text-decoration:none;border:1px solid var(--glass-brd);padding:5px 11px;border-radius:20px;}
  .modelink:hover{color:var(--ice-soft);}

  .thread{flex:1;overflow-y:auto;padding:22px 18px 14px;display:flex;flex-direction:column;gap:14px;position:relative;z-index:2;scroll-behavior:smooth;}
  .thread::-webkit-scrollbar{width:5px;} .thread::-webkit-scrollbar-thumb{background:rgba(95,179,232,0.25);border-radius:10px;}
  .empty-note{align-self:center;margin-top:20px;font-size:13px;color:var(--silver-dim);text-align:center;}

  .row{display:flex;gap:9px;max-width:88%;}
  .row.support{align-self:flex-start;} .row.user{align-self:flex-end;flex-direction:row-reverse;}
  .avatar{width:30px;height:30px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(150deg,#1a3a63,var(--navy-2));border:1px solid rgba(143,208,245,0.3);font-size:14px;margin-top:2px;}
  .row.user .avatar{background:linear-gradient(150deg,#274a72,#16283f);border-color:rgba(255,255,255,0.15);}
  .bubble{padding:11px 15px;border-radius:16px;font-size:14.5px;line-height:1.85;position:relative;white-space:pre-wrap;}
  .row.support .bubble{background:var(--glass);border:1px solid var(--glass-brd);border-top-left-radius:4px;color:var(--silver);backdrop-filter:blur(6px);}
  .row.user .bubble{background:linear-gradient(135deg, #2f6aa8, #1c4477);border:1px solid rgba(143,208,245,0.3);
    border-top-right-radius:4px;color:#eef6fc;box-shadow:0 4px 16px rgba(28,68,119,0.4);}
  .meta-time{font-size:10px;color:var(--silver-dim);margin-top:5px;padding:0 3px;}
  .row.user .meta-time{text-align:left;}

  .quick-row{display:flex;gap:8px;flex-wrap:wrap;padding:2px 18px 12px;position:relative;z-index:2;flex-shrink:0;}
  .chip{font-size:12.5px;color:var(--ice-soft);background:rgba(95,179,232,0.07);border:1px solid rgba(95,179,232,0.25);
    padding:7px 13px;border-radius:20px;cursor:pointer;transition:background 0.15s, transform 0.15s;white-space:nowrap;}
  .chip:hover{background:rgba(95,179,232,0.16);transform:translateY(-1px);}

  form.inputbar{display:flex;align-items:flex-end;gap:10px;padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px));
    background:linear-gradient(0deg, rgba(8,18,34,0.95), rgba(8,18,34,0.6));backdrop-filter:blur(14px);
    border-top:1px solid var(--glass-brd);position:relative;z-index:3;flex-shrink:0;}
  .field{flex:1;background:rgba(255,255,255,0.045);border:1px solid var(--glass-brd);border-radius:20px;padding:11px 16px;display:flex;align-items:center;}
  .field textarea{flex:1;background:transparent;border:none;outline:none;resize:none;color:var(--white);font-family:inherit;font-size:14.5px;max-height:90px;line-height:1.5;}
  .field textarea::placeholder{color:var(--silver-dim);}
  .sendbtn{width:44px;height:44px;border-radius:50%;flex-shrink:0;border:1px solid rgba(143,208,245,0.4);
    background:linear-gradient(150deg, var(--ice), #2c6fa8);display:flex;align-items:center;justify-content:center;
    cursor:pointer;box-shadow:0 4px 14px rgba(95,179,232,0.35);transition:transform 0.15s;}
  .sendbtn:active{transform:scale(0.92);}
  .sendbtn svg{width:19px;height:19px;}
  .sendbtn:disabled{opacity:0.4;cursor:default;}

  /* Admin layout */
  .admin{flex:1;display:flex;overflow:hidden;}
  .conv-list{width:260px;flex-shrink:0;border-inline-end:1px solid var(--glass-brd);overflow-y:auto;padding:10px;}
  .conv-item{padding:11px 12px;border-radius:12px;cursor:pointer;margin-bottom:6px;border:1px solid transparent;}
  .conv-item:hover{background:rgba(255,255,255,0.03);}
  .conv-item.active{background:rgba(95,179,232,0.1);border-color:rgba(95,179,232,0.25);}
  .conv-item .cname{font-size:13.5px;color:var(--white);display:flex;justify-content:space-between;gap:6px;}
  .conv-item .clast{font-size:11.5px;color:var(--silver-dim);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .unread-dot{width:7px;height:7px;border-radius:50%;background:var(--ice);flex-shrink:0;margin-top:3px;}
  .admin-chat{flex:1;display:flex;flex-direction:column;min-width:0;}
  .admin-empty{flex:1;display:flex;align-items:center;justify-content:center;color:var(--silver-dim);font-size:13.5px;}
  @media (max-width:640px){ .conv-list{width:110px;} .conv-item .clast{display:none;} }

/* Iran National premium showroom */
@import url('https://fonts.googleapis.com/css2?family=Estedad:wght@400;500;600;700;800&family=Vazirmatn:wght@300;400;500;600;700;800&display=swap');
body{font-family:'Estedad','Vazirmatn',sans-serif!important;}
.showroom{flex-shrink:0;padding:14px 18px 4px;background:linear-gradient(180deg,rgba(4,12,24,.82),rgba(4,12,24,.25));}
.showroom-head{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:10px}
.showroom-title{font-size:18px;font-weight:800;letter-spacing:-.4px}.showroom-title span{display:block;color:var(--ice-soft);font-size:11px;font-weight:500;margin-top:3px}
.showroom-badge{font-size:10px;color:#bfe7ff;border:1px solid rgba(95,179,232,.3);padding:5px 9px;border-radius:999px;background:rgba(95,179,232,.08)}
.product-strip{display:flex;gap:10px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}.product-strip::-webkit-scrollbar{display:none}
.product-card{min-width:210px;border:1px solid rgba(150,190,220,.16);border-radius:18px;padding:12px;background:linear-gradient(145deg,rgba(255,255,255,.065),rgba(255,255,255,.025));box-shadow:inset 0 1px rgba(255,255,255,.05),0 8px 25px rgba(0,0,0,.18);cursor:pointer;transition:.2s;position:relative;overflow:hidden}
.product-card:hover{transform:translateY(-2px);border-color:rgba(143,208,245,.35)}.product-card:active{transform:scale(.985)}
.product-icon{height:78px;border-radius:13px;background:radial-gradient(circle at 50% 20%,rgba(95,179,232,.16),transparent 55%),#071525;display:flex;align-items:center;justify-content:center;margin-bottom:9px;overflow:hidden}
.product-icon .mini-fridge{width:43px;height:61px;border:2px solid #9eb4c8;border-radius:5px;position:relative;background:linear-gradient(110deg,#0d1b2b,#263b50);box-shadow:9px 6px 0 -5px #091321}
.product-icon .mini-fridge:before{content:"";position:absolute;top:27px;left:4px;right:4px;border-top:1px solid #7190a8}.product-icon .mini-fridge:after{content:"";position:absolute;top:9px;right:5px;width:2px;height:13px;background:#b7c8d6;box-shadow:0 23px #b7c8d6}
.product-icon .mini-chest{width:74px;height:40px;border:2px solid #a9bdcd;border-radius:6px;background:linear-gradient(135deg,#16283a,#344d61);transform:perspective(100px) rotateX(8deg);position:relative}.product-icon .mini-chest:after{content:"";position:absolute;left:7px;right:7px;top:7px;height:2px;background:#7e9bb2}
.product-name{font-size:13px;font-weight:700}.product-meta{font-size:10px;color:var(--silver-dim);margin-top:3px}.view3d{margin-top:8px;width:100%;border:1px solid rgba(95,179,232,.3);background:rgba(95,179,232,.08);color:var(--ice-soft);border-radius:10px;padding:7px;font:inherit;font-size:10.5px;cursor:pointer}
.viewer-backdrop{position:fixed;inset:0;background:rgba(1,6,14,.82);backdrop-filter:blur(12px);z-index:50;display:none;align-items:center;justify-content:center;padding:18px}
.viewer-backdrop.open{display:flex}.viewer{width:min(760px,100%);height:min(680px,92vh);background:linear-gradient(145deg,#0a1729,#06101e);border:1px solid rgba(143,208,245,.25);border-radius:24px;box-shadow:0 25px 80px rgba(0,0,0,.5);overflow:hidden;display:flex;flex-direction:column}
.viewer-top{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--glass-brd)}.viewer-top strong{font-size:14px}.viewer-top span{display:block;color:var(--silver-dim);font-size:10px;margin-top:2px}
.viewer-close{width:34px;height:34px;border:1px solid var(--glass-brd);background:rgba(255,255,255,.05);color:white;border-radius:50%;cursor:pointer;font-size:18px}
#modelCanvas{flex:1;min-height:0;width:100%;display:block}.viewer-help{text-align:center;padding:9px;color:var(--silver-dim);font-size:10px;border-top:1px solid var(--glass-brd)}
@media(max-width:640px){.product-card{min-width:190px}.showroom-title{font-size:16px}.viewer{height:82vh}}

</style>
</head>

let threeViewer=null;
async function open3DModel(type,title){
  const back=document.getElementById('viewerBackdrop');
  const canvas=document.getElementById('modelCanvas');
  document.getElementById('viewerTitle').textContent=title;
  back.classList.add('open');
  if(threeViewer){threeViewer.dispose();threeViewer=null;}
  const THREE=await import('https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js');
  const {OrbitControls}=await import('https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/controls/OrbitControls.js');
  const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(canvas.clientWidth,canvas.clientHeight,false);
  renderer.shadowMap.enabled=true;
  const scene=new THREE.Scene(); scene.background=new THREE.Color(0x06101e);
  const camera=new THREE.PerspectiveCamera(35,canvas.clientWidth/canvas.clientHeight,.1,100); camera.position.set(4,2.8,6);
  const controls=new OrbitControls(camera,canvas); controls.enableDamping=true; controls.target.set(0,1.2,0);
  scene.add(new THREE.HemisphereLight(0xbfe7ff,0x08101c,2.1));
  const key=new THREE.DirectionalLight(0xffffff,3.2);key.position.set(4,6,5);key.castShadow=true;scene.add(key);
  const rim=new THREE.PointLight(0x5fb3e8,18,12);rim.position.set(-4,3,2);scene.add(rim);
  const group=new THREE.Group();scene.add(group);
  const mat=new THREE.MeshStandardMaterial({color:0x9aaab7,metalness:.78,roughness:.24});
  const dark=new THREE.MeshStandardMaterial({color:0x16283a,metalness:.5,roughness:.3});
  const glass=new THREE.MeshPhysicalMaterial({color:0x142b40,metalness:.15,roughness:.12,transmission:.18,transparent:true,opacity:.9});
  const addBox=(x,y,z,sx,sy,sz,m=mat)=>{const q=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),m);q.position.set(x,y,z);q.castShadow=q.receiveShadow=true;group.add(q);return q;};
  if(type==='fridge'){
    addBox(0,1.55,0,2.15,3.1,1.05,mat); addBox(0,1.55,.55,2.0,3.0,.055,glass);
    addBox(0,.35,.61,2.0,.035,.06,dark); addBox(0,2.72,.61,2.0,.035,.06,dark);
    [-.65,0,.65].forEach(x=>addBox(x,1.45,.61,.025,1.8,.07,dark));
    [-.64,0,.64].forEach(x=>addBox(x,1.55,.68,.045,.65,.045,mat));
    addBox(-.9,1.65,.68,.035,.85,.035,mat);addBox(.9,1.65,.68,.035,.85,.035,mat);
    addBox(0,.03,0,2.35,.08,1.2,dark);
  }else{
    addBox(0,1.0,0,3.0,1.35,1.55,mat);addBox(0,1.72,0,2.9,.18,1.48,dark);
    addBox(0,1.84,0,2.75,.08,1.35,glass);addBox(0,1.77,.78,1.2,.08,.08,mat);
    addBox(0,.26,0,3.25,.08,1.7,dark);
  }
  const floor=new THREE.Mesh(new THREE.CylinderGeometry(3.6,3.6,.08,64),new THREE.MeshStandardMaterial({color:0x081625,metalness:.3,roughness:.6}));
  floor.position.y=.02;floor.receiveShadow=true;scene.add(floor);
  let alive=true;
  const resize=()=>{if(!alive)return;const w=canvas.clientWidth,h=canvas.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();};
  window.addEventListener('resize',resize);
  const animate=()=>{if(!alive)return;requestAnimationFrame(animate);controls.update();renderer.render(scene,camera);};animate();
  threeViewer={dispose:()=>{alive=false;window.removeEventListener('resize',resize);controls.dispose();renderer.dispose();scene.traverse(o=>{if(o.geometry)o.geometry.dispose();if(o.material&&!Array.isArray(o.material))o.material.dispose();});}};
}
function close3DModel(){document.getElementById('viewerBackdrop').classList.remove('open');if(threeViewer){threeViewer.dispose();threeViewer=null;}}

const appRoot=document.getElementById('appRoot');
function nowStr(t){const d=t?new Date(t):new Date();return d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0');}
function esc(s){return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function getConvId(){let id=localStorage.getItem('iran_national_conv_id');if(!id){id='c_'+Math.random().toString(36).slice(2,10)+Date.now().toString(36);localStorage.setItem('faravoj_conv_id',id);}return id;}
async function api(url,opts){const r=await fetch(url,Object.assign({headers:{'Content-Type':'application/json'}},opts||{}));if(!r.ok)throw new Error(await r.text());return r.json();}

function renderCustomer(){
 appRoot.classList.remove('wide');
 appRoot.innerHTML=`<header><div class="logo-wrap"><img src="${LOGO_SRC}" alt="لوگوی ایران ناسیونال"></div><div class="brand"><strong>پشتیبانی فراوج</strong><span>تولید و پشتیبانی یخچال و فریزر صنعتی</span></div><div class="status"><span class="pill"><span class="dot"></span>آنلاین</span><a class="modelink" href="#admin">پنل ادمین</a></div></header>
<div class="showroom">
  <div class="showroom-head"><div class="showroom-title">نمایشگاه دیجیتال ایران ناسیونال<span>محصولات را سه‌بعدی ببینید و از زوایای مختلف بررسی کنید</span></div><div class="showroom-badge">3D SHOWROOM</div></div>
  <div class="product-strip">
    <div class="product-card"><div class="product-icon"><div class="mini-fridge"></div></div><div class="product-name">یخچال صنعتی سه‌درب</div><div class="product-meta">بدنه تمام استیل · سرمایش حرفه‌ای</div><button class="view3d" onclick="open3DModel('fridge','یخچال صنعتی سه‌درب ایران ناسیونال')">مشاهده مدل سه‌بعدی ↗</button></div>
    <div class="product-card"><div class="product-icon"><div class="mini-chest"></div></div><div class="product-name">فریزر صندوقی</div><div class="product-meta">طراحی شیک · مناسب فروشگاهی</div><button class="view3d" onclick="open3DModel('chest','فریزر صندوقی ایران ناسیونال')">مشاهده مدل سه‌بعدی ↗</button></div>
  </div>
</div>
<div class="viewer-backdrop" id="viewerBackdrop" onclick="if(event.target===this)close3DModel()">
  <div class="viewer"><div class="viewer-top"><div><strong id="viewerTitle">مدل سه‌بعدی</strong><span>با ماوس یا لمس، مدل را بچرخانید و زوم کنید</span></div><button class="viewer-close" onclick="close3DModel()">×</button></div><canvas id="modelCanvas"></canvas><div class="viewer-help">نمایش سه‌بعدی تعاملی · مناسب دسکتاپ و موبایل</div></div>
</div><div class="thread" id="thread"><div class="empty-note">در حال اتصال...</div></div><div class="quick-row" id="quickRow"><div class="chip" data-flow="price">استعلام قیمت</div><div class="chip" data-flow="shop">تماس با کارشناس فروشگاه</div><div class="chip" data-flow="tech">تماس با کارشناس فنی</div><div class="chip" data-flow="warranty">پشتیبانی گارانتی</div></div><form class="inputbar" id="chatForm"><div class="field"><textarea id="msgInput" rows="1" placeholder="پیام‌تون رو بنویسید..."></textarea></div><button type="submit" class="sendbtn" id="sendBtn" aria-label="ارسال"><svg viewBox="0 0 24 24" fill="none" stroke="#06182e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22 11 13 2 9z"/></svg></button></form>`;
 const thread=document.getElementById('thread'),form=document.getElementById('chatForm'),input=document.getElementById('msgInput'),sendBtn=document.getElementById('sendBtn'),quickRow=document.getElementById('quickRow');
 const convId=getConvId(); let messages=[];
 const chips={price:'لطفاً قیمت محصولات و شرایط خرید را اعلام کنید.',shop:'می‌خواهم با کارشناس فروش تماس بگیرم.',tech:'می‌خواهم با کارشناس فنی صحبت کنم.',warranty:'برای گارانتی و خدمات پس از فروش راهنمایی می‌خواهم.'};
 function paint(){thread.innerHTML='';if(!messages.length){thread.innerHTML='<div class="empty-note">سلام 🙏 به پشتیبانی ایران ناسیونال خوش اومدید. پیام‌تون رو بنویسید یا از گزینه‌های زیر انتخاب کنید.</div>';return;}messages.forEach(m=>{const row=document.createElement('div');row.className='row '+(m.sender==='support'?'support':'user');row.innerHTML=`<div class="avatar">${m.sender==='support'?'❄️':'🙂'}</div><div><div class="bubble">${esc(m.text)}</div><div class="meta-time">${nowStr(m.time)}</div></div>`;thread.appendChild(row);});thread.scrollTop=thread.scrollHeight;}
 async function load(){try{const d=await api('/api/conversations/'+encodeURIComponent(convId));messages=d.messages||[];paint();}catch(e){messages=[];paint();}}
 async function send(text){text=(text||'').trim();if(!text||sendBtn.disabled)return;sendBtn.disabled=true;messages.push({id:'u'+Date.now(),text,sender:'user',time:Date.now()});paint();try{const d=await api('/api/chat',{method:'POST',body:JSON.stringify({conversationId:convId,message:text})});if(d.message)messages.push(d.message);paint();}catch(e){messages.push({id:'e'+Date.now(),text:'متأسفانه فعلاً اتصال به هوش مصنوعی برقرار نشد. لطفاً چند لحظه بعد دوباره تلاش کنید.',sender:'support',time:Date.now()});paint();}finally{sendBtn.disabled=false;input.focus();}}
 form.addEventListener('submit',e=>{e.preventDefault();const t=input.value;input.value='';input.style.height='auto';send(t);});
 input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();const t=input.value;input.value='';input.style.height='auto';send(t);}});input.addEventListener('input',()=>{input.style.height='auto';input.style.height=Math.min(input.scrollHeight,90)+'px';});quickRow.addEventListener('click',e=>{const c=e.target.closest('.chip');if(c)send(chips[c.dataset.flow]);});load();
}

function renderAdmin(){
 appRoot.classList.add('wide');appRoot.innerHTML=`<header><div class="logo-wrap"><img src="${LOGO_SRC}" alt="لوگوی فراوج"></div><div class="brand"><strong>پنل ادمین پشتیبانی</strong><span>ایران ناسیونال · پنل مدیریت</span></div><div class="status"><span class="pill" id="convCount"><span class="dot"></span>0 گفتگو</span><a class="modelink" href="#">نمای مشتری</a></div></header><div class="admin"><div class="conv-list" id="convList"><div class="empty-note" style="padding:16px;">در حال بارگذاری...</div></div><div class="admin-chat" id="adminChat"><div class="admin-empty">یک گفتگو را انتخاب کنید</div></div></div>`;
 const list=document.getElementById('convList'),count=document.getElementById('convCount');let convs=[];
 async function refresh(){try{convs=await api('/api/conversations');count.innerHTML=`<span class="dot"></span>${convs.length} گفتگو`;list.innerHTML='';convs.forEach(c=>{const el=document.createElement('div');el.className='conv-item';el.innerHTML=`<div class="cname"><span>${esc(c.name||'مراجعه‌کننده')}</span>${c.unread?'<span class="unread-dot"></span>':''}</div><div class="clast">${esc(c.lastText||'')}</div>`;el.onclick=()=>open(c.id);list.appendChild(el);});}catch(e){list.innerHTML='<div class="empty-note" style="padding:16px;">خطا در دریافت گفتگوها.</div>';}}
 async function open(id){const chat=document.getElementById('adminChat');try{let d=await api('/api/conversations/'+encodeURIComponent(id));chat.innerHTML=`<div class="thread" id="athread"></div><form class="inputbar" id="adminForm"><div class="field"><textarea id="adminInput" rows="1" placeholder="پاسخ به مراجعه‌کننده..."></textarea></div><button type="submit" class="sendbtn" aria-label="ارسال"><svg viewBox="0 0 24 24" fill="none" stroke="#06182e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22 11 13 2 9z"/></svg></button></form>`;const th=document.getElementById('athread');function paint(){th.innerHTML='';(d.messages||[]).forEach(m=>{const row=document.createElement('div');row.className='row '+(m.sender==='support'?'support':'user');row.innerHTML=`<div class="avatar">${m.sender==='support'?'❄️':'🙂'}</div><div><div class="bubble">${esc(m.text)}</div><div class="meta-time">${nowStr(m.time)}</div></div>`;th.appendChild(row);});th.scrollTop=th.scrollHeight;}paint();await api('/api/conversations/'+encodeURIComponent(id)+'/read',{method:'POST'});document.getElementById('adminForm').onsubmit=async e=>{e.preventDefault();const inp=document.getElementById('adminInput'),t=inp.value.trim();if(!t)return;inp.value='';d=await api('/api/conversations/'+encodeURIComponent(id)+'/message',{method:'POST',body:JSON.stringify({text:t})});paint();refresh();};}catch(e){chat.innerHTML='<div class="admin-empty">خطا در باز کردن گفتگو</div>';}}
 refresh();setInterval(refresh,5000);
}
function boot(){if(location.hash==='#admin')renderAdmin();else renderCustomer();}window.addEventListener('hashchange',boot);boot();
